[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-client"
version = "0.1.0"
description = "Strategy-side client for the Quant Strategy Control Centre (tick-data gateway)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Quant Strategy Control Centre" }]
dependencies = ["redis>=5.0"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/abhilashnanda/quant-control-centre"

[tool.setuptools.packages.find]
where = ["src"]
