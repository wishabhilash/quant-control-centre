name: CI & Deploy

# One pipeline for the whole lifecycle:
#
#   pull_request  → gate only (backend tests + frontend typecheck + build)
#   push to main  → gate, then deploy to EC2 (only if the gate passed)
#   manual        → gate, then deploy (with an optional release tag)
#
# The deploy job `needs: gate`, so a failing test can never reach the server.
# The frontend bundle and the backend package are built ONCE in the gate job
# and handed to the deploy job as artifacts.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Version tag to record (defaults to the commit sha)"
        required: false

concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gate:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platform/backend/requirements.txt
      - name: Install backend dependencies
        working-directory: platform/backend
        run: pip install -r requirements.txt
      - name: Run the backend test suite
        working-directory: platform/backend
        run: python -m pytest

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: platform/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: platform/frontend
        run: npm ci
      - name: Typecheck
        working-directory: platform/frontend
        run: npm run typecheck
      - name: Production build
        working-directory: platform/frontend
        run: npm run build

      - name: Package the backend
        run: |
          rm -rf /tmp/pkg && mkdir -p /tmp/pkg/deploy
          rsync -a --exclude='.venv' --exclude='venv' --exclude='__pycache__' \
                  --exclude='*.pyc' --exclude='.env' --exclude='.pytest_cache' \
                  platform/backend/ /tmp/pkg/
          # Ship the systemd unit with the artifact so the installer can write it.
          cp deploy/systemd/quant-backend.service /tmp/pkg/deploy/
          tar -czf backend.tar.gz -C /tmp/pkg .
      - name: Package the frontend bundle
        run: tar -czf frontend-dist.tar.gz -C platform/frontend/dist .

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            backend.tar.gz
            frontend-dist.tar.gz
          retention-days: 7

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: gate
    if: github.event_name != 'pull_request'
    # `environment: production` gives you required reviewers + scoped secrets.
    environment: production
    env:
      # Install root on the instance. Override with a GitHub Actions *variable*
      # named APP_DIR (Settings → Environments → production → Variables) if the
      # instance uses a different path; the default matches the repo name.
      APP_DIR: ${{ vars.APP_DIR || '/opt/quant-control-centre' }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release
          path: artifacts

      - name: Configure SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Host key pinning (preferred over ssh-keyscan, which trusts whatever
          # answers on first connect).
          printf '%s\n' "${{ secrets.EC2_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Check sudo access on the instance
        run: |
          # The deploy restarts systemd units, creates the service user and
          # installs packages — it needs root. Fail fast with a clear message.
          ssh "$EC2_USER@$EC2_HOST" \
            "if [ '\$(id -u)' = 0 ]; then echo 'root OK'; else sudo -n true && echo 'sudo OK' || { echo 'ERROR: the deploy user needs passwordless sudo' >&2; exit 1; }; fi"

      - name: Upload artifacts
        run: |
          # The whole deploy/ directory: deploy-ec2.sh, its shared library and
          # the systemd unit template.
          scp -r artifacts/backend.tar.gz artifacts/frontend-dist.tar.gz deploy/ \
            "$EC2_USER@$EC2_HOST:/tmp/"

      - name: Deploy on the instance
        env:
          RELEASE_SHA: ${{ github.event.inputs.release_sha || github.sha }}
        run: |
          ssh "$EC2_USER@$EC2_HOST" \
            "APP_DIR='$APP_DIR' RELEASE_SHA='$RELEASE_SHA' \
             if [ '\$(id -u)' = 0 ]; then \
               bash /tmp/deploy/deploy-ec2.sh /tmp/backend.tar.gz /tmp/frontend-dist.tar.gz; \
             else \
               sudo -n bash /tmp/deploy/deploy-ec2.sh /tmp/backend.tar.gz /tmp/frontend-dist.tar.gz; \
             fi"
      - name: Verify health
        run: |
          ssh "$EC2_USER@$EC2_HOST" \
            "curl -fsS http://127.0.0.1:8000/health && echo"
