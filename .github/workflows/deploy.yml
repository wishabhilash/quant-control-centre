name: Deploy to EC2

# Builds the platform (backend + production frontend bundle) and ships it to the
# EC2 instance, where deploy/deploy-ec2.sh installs it, restarts the systemd
# service, health-checks it and refreshes the cron lines.
#
# Strategy data (/var/lib/quant/strategies) and the platform's runtime state
# are NOT part of the artifact and are never touched by this pipeline.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Version tag to record (defaults to the commit sha)"
        required: false

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Gate: never deploy a broken build. The same checks CI runs on PRs.
  gate:
    name: Test & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platform/backend/requirements.txt
      - name: Install backend dependencies
        working-directory: platform/backend
        run: pip install -r requirements.txt
      - name: Run the backend test suite
        working-directory: platform/backend
        run: python -m pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: platform/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: platform/frontend
        run: npm ci
      - name: Typecheck
        working-directory: platform/frontend
        run: npm run typecheck

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: gate
    # `environment: production` gives you required reviewers + scoped secrets.
    environment: production
    env:
      # Install root on the instance. Override with a GitHub Actions *variable*
      # named APP_DIR (Settings → Environments → production → Variables) if the
      # instance uses a different path; the default matches the repo name.
      APP_DIR: ${{ vars.APP_DIR || '/opt/quant-control-centre' }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: platform/backend
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: platform/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: platform/frontend
        run: npm ci
      - name: Build the frontend bundle
        working-directory: platform/frontend
        run: npm run build

      - name: Package the backend
        run: |
          rm -rf /tmp/pkg && mkdir -p /tmp/pkg/deploy
          rsync -a --exclude='.venv' --exclude='venv' --exclude='__pycache__' \
                  --exclude='*.pyc' --exclude='.env' --exclude='.pytest_cache' \
                  platform/backend/ /tmp/pkg/
          # Ship the systemd unit with the artifact so the installer can update it.
          cp deploy/systemd/quant-backend.service /tmp/pkg/deploy/
          tar -czf backend.tar.gz -C /tmp/pkg .
      - name: Package the frontend bundle
        run: tar -czf frontend-dist.tar.gz -C platform/frontend/dist .

      - name: Configure SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Host key pinning (preferred over ssh-keyscan, which trusts whatever
          # answers on first connect).
          printf '%s\n' "${{ secrets.EC2_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload artifacts
        run: |
          scp backend.tar.gz frontend-dist.tar.gz deploy/deploy-ec2.sh \
            "$EC2_USER@$EC2_HOST:/tmp/"

      - name: Deploy on the instance
        env:
          RELEASE_SHA: ${{ github.event.inputs.release_sha || github.sha }}
        run: |
          ssh "$EC2_USER@$EC2_HOST" \
            "sudo -n env APP_DIR='$APP_DIR' RELEASE_SHA='$RELEASE_SHA' \
             bash /tmp/deploy-ec2.sh /tmp/backend.tar.gz /tmp/frontend-dist.tar.gz"

      - name: Verify health
        run: |
          ssh "$EC2_USER@$EC2_HOST" \
            "curl -fsS http://127.0.0.1:8000/health && echo"
